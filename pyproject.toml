[project]
name = "reachy-11labs-agent"
version = "0.1.0"
description = "Reachy Mini + ElevenLabs Agent + PinchTab form-filling assistant"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=1.0.0",
    "requests",
    "numpy",
    "reachy-mini==1.9.0",
]

[project.scripts]
reachy-agent = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "reachy_audio.py", "motion.py", "pinchtab_tools.py"]

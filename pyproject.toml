[project]
name = "reachy-11labs-agent"
version = "0.1.0"
description = "Reachy Mini + ElevenLabs Agent + PinchTab form-filling assistant"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "reachy_mini>=1.0.0",
]

[project.scripts]
reachy-agent = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
